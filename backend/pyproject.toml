[project]
name = "nextgen-agency-os-backend"
version = "3.0.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi[standard]>=0.115,<1",
  "sqlalchemy>=2.0.29,<3",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "email-validator>=2.0,<3",
  "httpx>=0.27,<1",
  "python-multipart>=0.0.9",
  "python-dotenv>=1.0.1",
  "openai>=1.40.0",
  "groq>=0.4.2",
  "psycopg[binary]>=3.2,<4",
  "PyJWT>=2.9,<3",
  "passlib[bcrypt]==1.7.4",
  "bcrypt==4.0.1",
]

[tool.fastapi]
entrypoint = "app.main:app"
